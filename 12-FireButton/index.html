<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fire Button</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <span class="badge">
            CSS WOW UI #12
        </span>

        <h1>Fire Button</h1>

        <p class="intro">
            A glowing interactive button with animated flames,
            rising embers and explosive click effects.
        </p>

        <section class="fire-scene">

            <div class="ambient-glow" aria-hidden="true"></div>

            <div class="fire-wrapper" id="fireWrapper">

                <canvas
                    class="fire-canvas"
                    id="fireCanvas"
                    aria-hidden="true"
                ></canvas>

                <button
                    class="fire-button"
                    id="fireButton"
                    type="button"
                >
                    <span class="button-reflection"></span>
                    <span class="button-shine"></span>

                    <span class="button-content">
                        <span class="button-icon">🔥</span>
                        <span class="button-text">Ignite Now</span>
                    </span>
                </button>

                <div
                    class="effect-layer"
                    id="effectLayer"
                    aria-hidden="true"
                ></div>

            </div>

            <div class="floor-glow" aria-hidden="true"></div>

        </section>

        <p class="hint">
            Hover to intensify the flames. Click to ignite.
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
