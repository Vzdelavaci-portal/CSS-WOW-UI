<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login Form Animation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <span class="badge">
            CSS WOW UI #16
        </span>

        <h1>Login Form Animation</h1>

        <p class="intro">
            A modern animated login form with floating labels,
            validation states and smooth interactions.
        </p>

        <section class="login-card">

            <div class="login-icon">
                <span>🔐</span>
            </div>

            <h2>Welcome Back</h2>

            <p class="description">
                Enter your account details to continue.
            </p>

            <form
                class="login-form"
                id="loginForm"
            >

                <div class="input-group">

                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        required
                    >

                    <label for="email">
                        Email Address
                    </label>

                    <span class="input-icon">
                        ✉️
                    </span>

                </div>

                <div class="input-group">

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        required
                    >

                    <label for="password">
                        Password
                    </label>

                    <button
                        class="password-toggle"
                        id="passwordToggle"
                        type="button"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span class="checkmark"></span>

                        <span>
                            Remember me
                        </span>

                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>

                <p
                    class="status-message"
                    id="statusMessage"
                ></p>

                <button
                    class="login-button"
                    id="loginButton"
                    type="submit"
                >

                    <span class="button-text">
                        Sign In
                    </span>

                    <span class="loader"></span>

                    <span class="success-icon">
                        ✓
                    </span>

                </button>

            </form>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="social-login">

                <button type="button">
                    G
                </button>

                <button type="button">
                    GH
                </button>

                <button type="button">
                    
                </button>

            </div>

            <p class="signup">
                Don't have an account?
                <a href="#">
                    Create account
                </a>
            </p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
